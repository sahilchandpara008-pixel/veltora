name: Build Veltora APK

on:
  push:
    paths: ["streams-android/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["streams-android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the APK to the "veltora-latest" release (public download link)
    defaults:
      run:
        working-directory: streams-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Supabase keys come from repo secrets (Settings → Secrets and variables → Actions).
      # Without them the APK still builds, but it can't connect to your backend.
      - name: Write local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # "Veltora" — one app for everyone; the admin panel opens by tapping the version 7 times.
      - uses: actions/upload-artifact@v4
        with:
          name: Veltora-v1.1.${{ github.run_number }}
          path: streams-android/app/build/outputs/apk/debug/app-debug.apk

      # Public download link for customers / ads (no GitHub login, no zip):
      # https://github.com/<owner>/<repo>/releases/download/veltora-latest/Veltora.apk
      - name: Publish APK to the public download link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Veltora.apk
          # Same app, tagged as coming from Meta ads (unlocks STREAMS_SPECIAL content on first start).
          ./gradlew assembleDebug -PapkReferrer="utm_source=meta&utm_medium=paid_social&utm_campaign=apk_download"
          cp app/build/outputs/apk/debug/app-debug.apk Veltora-ads.apk
          gh release view veltora-latest >/dev/null 2>&1 || \
            gh release create veltora-latest --title "Veltora" --notes "Latest Veltora app for Android." --latest
          gh release edit veltora-latest --title "Veltora v1.1.${{ github.run_number }}"
          gh release upload veltora-latest Veltora.apk Veltora-ads.apk --clobber

      # Google Play: signed release bundle (.aab), built only when the upload key secrets exist
      # (UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD).
      # Download it from this run's artifacts and upload it in Play Console.
      - name: Build signed release bundle for Google Play
        id: aab
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No upload key secrets yet - skipping the Play Store bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Same release build as an APK, to install on a phone and test before uploading the .aab.
          set +e
          UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease assembleRelease --stacktrace 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          set -e
          rm -f "$RUNNER_TEMP/upload.jks"
          if [ "$status" -ne 0 ]; then
            # Show the cause as annotations on the run page (logs aren't always easy to open).
            grep -E "^e: |Missing class|ERROR:|Error:|What went wrong|> " release-build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          cp app/build/outputs/bundle/release/app-release.aab "Veltora-v1.1.${{ github.run_number }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "Veltora-release-test-v1.1.${{ github.run_number }}.apk"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.built == 'true'
        with:
          name: Veltora-PlayStore-v1.1.${{ github.run_number }}
          path: |
            streams-android/Veltora-v1.1.${{ github.run_number }}.aab
            streams-android/Veltora-release-test-v1.1.${{ github.run_number }}.apk
